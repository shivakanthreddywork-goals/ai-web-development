<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Chat | AI Web App</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.shell{width:min(780px,100%);background:white;border:1px solid #e0e7f0;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #18274714}
header{padding:24px;background:#172b4d;color:white}header h1{margin:0 0 6px;font-size:1.45rem}header p{margin:0;color:#d8e4f6}
#chat{height:430px;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:86%;padding:12px 15px;border-radius:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{align-self:flex-start;background:#eef3fa}.user{align-self:flex-end;color:white;background:#315bd6}
form{display:flex;gap:10px;padding:18px;border-top:1px solid #e5eaf2}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid #ccd5e3;border-radius:12px;font:inherit}
button{border:0;border-radius:12px;padding:0 20px;color:white;background:#315bd6;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}footer{padding:0 20px 18px;color:#68758a;font-size:.82rem}
</style>
</head>
<body><main class="shell">
<header><h1>Customer Support Assistant</h1><p>Ask a general product or support question.</p></header>
<section id="chat" aria-live="polite"><div class="bubble assistant">Hello! I'm a demo support assistant. How can I help you today?</div></section>
<form id="form"><input id="message" autocomplete="off" maxlength="4000" placeholder="Type your question..." aria-label="Your message" required><button id="send" type="submit">Send</button></form>
<footer id="status">Demo mode if no API key is configured. Do not share passwords or payment details.</footer>
</main>
<script>
const chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#message"),button=document.querySelector("#send"),statusLine=document.querySelector("#status"),history=[];
function addBubble(text,role){const el=document.createElement("div");el.className=`bubble ${role}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
form.addEventListener("submit",async event=>{event.preventDefault();const text=input.value.trim();if(!text)return;
history.push({role:"user",content:text});addBubble(text,"user");input.value="";button.disabled=true;statusLine.textContent="Assistant is thinking...";
try{const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
if(!response.ok)throw new Error("Request failed. Please try again.");const data=await response.json();history.push({role:"assistant",content:data.reply});addBubble(data.reply,"assistant");statusLine.textContent=`Connected • ${data.mode}`;
}catch(error){addBubble(error.message||"Something went wrong.","assistant");statusLine.textContent="Connection issue";}
finally{button.disabled=false;input.focus();}});
</script></body></html>
